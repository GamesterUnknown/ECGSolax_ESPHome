substitutions:
 # device_name: "ecgsolax-invertor"
 # friendly_name: ECGSolax Invertor
 # node_name: "ECGSolax Invertor"


  device_name: "inverter"  
  inverter_name: "Inverter"
  node_name: "My Inverter"
  node_id: ECGSolax_Inverter
  inverter_tx_pin: GPIO7
  #GPIO5
  inverter_rx_pin: GPIO6
  #GPIO4
  inverter_voltage_offset: "0"
  #pzem_tx_pin: GPIO1
  #pzem_rx_pin: GPIO3
  #pzem_voltage_offset: "0"
  #pzem_current_offset: "0"
  update_interval: 2s # Minimum 10s recommended to avoid duplicate command errors
  select_skip_updates: "6"
  read_skip_updates: "6"
  #pzem_update_interval: 10s # Needs to be 1/5 of update interval because of smoothing filter on pzem readings

  jk_name: BMS
  #external_components_source: github://syssi/esphome-jk-bms@main
  #external_components_source1: https://github.com/syssi/esphome-jk-bms
  # Please use "JK02_24S" if you own a old JK-BMS < hardware version 11.0 (hardware version >= 6.0 and < 11.0)
  # Please use "JK02_32S" if you own a new JK-BMS >= hardware version 11.0 (f.e. JK-B2A8S20P hw 11.XW, sw 11.26)
  # Please use "JK04" if you have some old JK-BMS <= hardware version 3.0 (f.e. JK-B2A16S hw 3.0, sw. 3.3.0)
  protocol_version: JK02_32S



esphome: 
  name: "${device_name}"
  friendly_name: "${node_name}"
  comment: "Monitor and control a solar inverter"
  build_path: /config/esphome/build/${node_id}
  platformio_options:
   board_build.flash_mode: dio
  #includes:
  #  - "helpers"
  project:
    name: "esphome.ECGSolax_Invertor"
    version: 1.2.0

external_components:
 - source: github://GamesterUnknown/esphome-pipsolar@pip8048
   components: [pipsolar]
   refresh: 0s
 - source: github://GamesterUnknown/ECGSolax_ESPHome@main
   components: [mypipsolar]
   refresh: 0s

#external_components:
#  - source:
#      type: git
#      url: ${external_components_source1}
#      ref: main
#  - source: ${external_components_source}
#    refresh: 0s
   
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
    #version: recommended
    #type: arduino


# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key


ota:
 - platform: esphome
   password: !secret ota_password
   on_begin:
    then:
      - switch.turn_off: ble_client_switch0
      - logger.log: "BLE connection suspended for OTA update"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "My-Inverter Fallback Hotspot"
    password: !secret ap_password

captive_portal:

packages:
  # You can replace next 2 lines with your common configs for all devices
 # common_system: !include includes/common_system.yaml
  common_sensors: !include includes/common_sensors.yaml
  jk_bms_v19: !include includes/esp32-ble-v19-example.yaml #BMS V19 sensors
  #jk_bms_v15: !include includes/esp32-ble-v15-example.yaml #BMS V15 sensors
  #pzem: !include includes/pzem.yaml # uncomment if use PZEM 004 module



#For debug:
#debug:
#  update_interval: 10s

#sensor:
#  - platform: debug
#    free:
#      name: "Heap Free"

logger:
  id: uart_logger
 # baud_rate: 0
  level:  DEBUG #INFO #WARN #DEBUG #VERBOSE
  # logs:
  #   component: ERROR # Fix for issue #4717 "Component xxxxxx took a long time for an operation"
#  logs:
#    esp32_ble_tracker: DEBUG #INFO
#    esp32_ble_client: DEBUG #INFO

time:
  - platform: homeassistant
    id: hass_time
#    on_time_sync:
#      then:
#       - lambda: |-
#            id(inverter0).sync_time();

web_server:
 port: 80
 local: true
#  ota: false

  
uart:
  - id: uart_inverter
    baud_rate: 2400
    tx_pin: ${inverter_tx_pin}
    rx_pin: ${inverter_rx_pin}
    debug:
     direction: BOTH
     dummy_receiver: false
     after:
      delimiter: "\n"
     sequence:
      - lambda: UARTDebug::log_string(direction, bytes);
 
text:
  - platform: template
    mode: text
    id: custom_command_input
    name: "${inverter_name} Custom PIP Command"
    optimistic: true  


pipsolar:
  uart_id: uart_inverter
  id: inverter0
  
#mypipsolar:
#  uart_id: uart_inverter
#  id: inverter0
#  time_id: hass_time

button:
  - platform: template
    name: "${inverter_name} Send Custom PIP Command"
    on_press:
      then:
        - lambda: |-
            id(inverter0)->switch_command(id(custom_command_input).state);

sensor:
  - platform: pipsolar
    pipsolar_id: inverter0
    # QPIRI
#    grid_rating_voltage:
#      name: "${inverter_name} grid_rating_voltage"
#    grid_rating_current:
#      name: "${inverter_name} grid_rating_current"
    ac_output_rating_voltage:
      name: "${inverter_name} Target Output Voltage"
      entity_category: "diagnostic"
    ac_output_rating_frequency:
      name: "${inverter_name} Target Output Frequency"
      entity_category: "diagnostic"
#    ac_output_rating_current:
#      name: "${inverter_name} ac_output_rating_current"
#    ac_output_rating_apparent_power:
#      name: "${inverter_name} ac_output_rating_apparent_power"
#    ac_output_rating_active_power:
#      name: "${inverter_name} ac_output_rating_active_power"
#    battery_rating_voltage:
#      name: "${inverter_name} battery_rating_voltage"
    battery_recharge_voltage:
      name: "${inverter_name} Back To Utility Source Voltage"
      entity_category: "diagnostic"
    battery_under_voltage:
      name: "${inverter_name} Low CutOff Voltage"
      entity_category: "diagnostic"
    battery_bulk_voltage:
      name: "${inverter_name} Bulk Charging Voltage"
      entity_category: "diagnostic"
    battery_float_voltage:
      name: "${inverter_name} Floating Charging Voltage"
      entity_category: "diagnostic"
    battery_type:
      name: "${inverter_name} Battery Type"
      entity_category: "diagnostic"     
    current_max_ac_charging_current:
      name: "${inverter_name} Max Utility Charging Current"
      entity_category: "diagnostic"
    current_max_charging_current:
      name: "${inverter_name} Max Total Charging Current"
      entity_category: "diagnostic"
    input_voltage_range:
      name: "${inverter_name} AC Input Voltage Range"
      entity_category: "diagnostic"
    output_source_priority:
      name: "${inverter_name} Output Source Priority"
      entity_category: "diagnostic"
    charger_source_priority:
      name: "${inverter_name} Charger Source Priority"
      entity_category: "diagnostic"
#    parallel_max_num:
#      name: "${inverter_name} parallel_max_num"
#      entity_category: "diagnostic"
    machine_type:
      name: "${inverter_name} machine_type"
      entity_category: "diagnostic"
    topology:
      name: "${inverter_name} topology"
      entity_category: "diagnostic"
    output_mode:
      name: "${inverter_name} output_mode"
      entity_category: "diagnostic"
    battery_redischarge_voltage:
      name: "Back To Battery Source Voltage"
      entity_category: "diagnostic"
    pv_ok_condition_for_parallel:
      name: "${inverter_name} pv_ok_condition_for_parallel"
      entity_category: "diagnostic"
    pv_power_balance:
      name: "${inverter_name} pv_power_balance"
      entity_category: "diagnostic"

    # QPIGS
    grid_voltage:
      name: "${inverter_name} Grid Voltage"
      device_class: voltage
      state_class: measurement
    grid_frequency:
      name: "${inverter_name} Grid Frequency"
      device_class: frequency
      state_class: measurement
    ac_output_voltage:
      name: "${inverter_name} Load Voltage"
      device_class: voltage
      state_class: measurement
      id: load_voltage
    ac_output_frequency:
      name: "${inverter_name} Load Frequency"
      device_class: frequency
      state_class: measurement
    ac_output_apparent_power:
      name: "${inverter_name} Load Power VA"
      id: load_Power_VA
      device_class: power
      state_class: measurement
    ac_output_active_power:
      name: "${inverter_name} Load Power"
      id: load_power
      device_class: power
      state_class: measurement
    output_load_percent:
      name: "${inverter_name} Load Percent"
      device_class: power_factor
      state_class: measurement
    bus_voltage:
      name: "${inverter_name} Bus Voltage"
      device_class: voltage
      state_class: measurement
    battery_voltage:
      id: battery_voltage
      name: "${inverter_name} Battery Voltage"
      device_class: voltage
      state_class: measurement
    battery_charging_current:
      id: battery_charge_current
      name: "${inverter_name} Battery Charge Current" 
      device_class: current
      state_class: measurement
    battery_capacity_percent:
      name: "${inverter_name} Battery SoC"
      device_class: battery
      state_class: measurement
    inverter_heat_sink_temperature:
      name: "${inverter_name} Temperature"
#    pv_input_current_for_battery:
    pv1_input_current:
      name: "${inverter_name} PV Current"
      device_class: current
      state_class: measurement
    pv1_input_voltage:
      name: "${inverter_name} PV Voltage"
      device_class: voltage
      state_class: measurement
#    battery_voltage_scc:
#      name: "${inverter_name} !Battery Voltage SCC"
    battery_discharge_current:
      name: "${inverter_name} Battery Discharge Current"
      device_class: current
      state_class: measurement
      id: battery_discharge_current
#    battery_voltage_offset_for_fans_on:
#      name: "${inverter_name} !Battery Voltage offset for fans on"
#    eeprom_version:
#      name: "${inverter_name} !eeprom_version"
    pv1_charging_power:
      name: "${inverter_name} PV Power"
      device_class: power
      state_class: measurement

  - platform: template
    name: "${inverter_name} Battery Current"
    id: battery_current
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    update_interval: ${update_interval}
    lambda: |-
      return id(battery_charge_current).state - id(battery_discharge_current).state;

  - platform: template
    name: "${inverter_name} Battery Power"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: ${update_interval}
    lambda: |-
      return id(battery_current).state * id(battery_voltage).state;

  - platform: template
    name: "${inverter_name} Load Current"
    id: load_current
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: ${update_interval}
    lambda: |-
      if (id(load_voltage).state == 0) {
        return 0;
      }
      return id(load_Power_VA).state / id(load_voltage).state;


  - platform: template
    name: "${inverter_name} Load Power Factor"
    id: load_power_factor
    device_class: power_factor
    state_class: measurement
    accuracy_decimals: 2
    update_interval: ${update_interval}
    lambda: |-
      if (id(load_power).state == 0) {
        return 0;
      }
      return id(load_power).state / id(load_Power_VA).state;


text_sensor:
  - platform: pipsolar
    pipsolar_id: inverter0
    device_mode:
      name: "${inverter_name} Device Mode"
      filters:
        map:
          - P -> Power on mode
          - S -> Standby mode
          - L -> Line mode
          - B -> Battery mode
          - F -> Fault mode
          - D -> Shutdown mode
    last_custom_command:
      name: "${inverter_name} Custom Command response"    
#    last_qt:
#      name: "${inverter_name} Date-Time" 
#    last_qpigs:
#      name: "${inverter_name} ${inverter_name} last_qpigs"
#    last_qpiri:
