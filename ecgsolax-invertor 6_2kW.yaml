      entity_category: config


select:
  - platform: pipsolar
    pipsolar_id: inverter0
    pv_energy_feeding_priority:
      id: pv_energy_feeding_priority_select
      name: "${inverter_name} PV Energy Feeding Priority"
      entity_category: config
      optionsmap:
        "Battery Load Utility (BLU)": "PVENGUSE00"
        "Load Battery Utility (LBU)": "PVENGUSE01"

  - platform: pipsolar
    pipsolar_id: inverter0
    output_source_priority:
      id: output_source_priority_select
      name: "${inverter_name} Menu 01: Output Source Priority"
      entity_category: config
      optionsmap:
        "Solar Utility Battery (SUB)": "POP00"
        "Solar Battery Utility (SBU)": "POP01"
      statusmap:
        "0": "Solar Utility Battery (SUB)"
        "1": "Solar Battery Utility (SBU)"

  - platform: pipsolar
    pipsolar_id: inverter0
    charger_source_priority:
