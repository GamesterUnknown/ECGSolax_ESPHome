#    last_qmod:
#     name: "${inverter_name} last_qmod"
#    last_qflag:
#     name: "${inverter_name} last_qflag"

  - platform: homeassistant
    name: "${inverter_name} Custom PIP Command from HA"
    id: custom_command_input_ha
    entity_id: input_text.custom_pip_command

