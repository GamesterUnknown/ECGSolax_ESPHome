switch:
  - platform: restart
    name: "${inverter_name} Invertor Restart"
    entity_category: config

  - platform: pipsolar
    pipsolar_id: inverter0
#sending POP00 command which is SUB for ECGSolax
    output_source_priority_utility:
      name: "${inverter_name} Solar Utility Battery (SUB)"
      entity_category: config
#sending POP01 command which is SBU for ECGSolax
    output_source_priority_solar:
      name: "${inverter_name} Solar Battery Utility (SBU)"
      entity_category: config
#sending POP02 command which is not accepted by ECGSolax
#    output_source_priority_battery:
#     name: "${inverter_name} output_source_priority_battery"
#      entity_category: config
    input_voltage_range:
      name: "${inverter_name} Menu 03: AC Input Voltage (OFF: Appliance, ON: UPS)"
      entity_category: config
    pv_ok_condition_for_parallel:
      name: "${inverter_name} pv_ok_condition_for_parallel"
      entity_category: config
    pv_power_balance:
      name: "${inverter_name} pv_power_balance"
      entity_category: config


select:
  - platform: pipsolar
    pipsolar_id: inverter0
    output_source_priority:
      id: output_source_priority_select
      name: "${inverter_name} Menu 01: Output Source Priority"
      entity_category: config
      optionsmap:
        "Solar Utility Battery (SUB)": "POP00"
        "Solar Battery Utility (SBU)": "POP01"
      statusmap:
        "0": "Solar Utility Battery (SUB)"
        "1": "Solar Battery Utility (SBU)"

  - platform: pipsolar
    pipsolar_id: inverter0
    charger_source_priority:
      name: "${inverter_name} Menu 16: Charger Source Priority"
      entity_category: config
      optionsmap:
#        "Utility first": "PCP00" #Utility first mode not available for ECGSolax 
        "Solar first": "PCP00"
        "Solar and utility": "PCP01"
        "Solar only": "PCP02"
      statusmap:
#        "0": "Utility first"
        "0": "Solar first"
        "1": "Solar and utility"
        "2": "Solar only"

  - platform: pipsolar
    pipsolar_id: inverter0
    current_max_ac_charging_current:
      name: "${inverter_name} Menu 11: Max Utility Charge Current"
      entity_category: config
      optionsmap:
