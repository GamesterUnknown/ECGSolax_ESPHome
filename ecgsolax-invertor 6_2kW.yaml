      name: "${inverter_name} pv_ok_condition_for_parallel"
      entity_category: config
    pv_power_balance:
      name: "${inverter_name} pv_power_balance"
      entity_category: config
    buzzer:
      name: "${inverter_name} Buzzer (Beep)"
      entity_category: config
    overload_bypass:
      name: "${inverter_name} Overload Bypass Switch"
      entity_category: config
    lcd_escape_to_default:
      name: "${inverter_name} Return To Default Screen Switch"
      entity_category: config
    overload_restart:
      name: "${inverter_name} Restart On Overload Switch"
      entity_category: config
    over_temperature_restart:
      name: "${inverter_name} Restart On Overheat Switch"
      entity_category: config
