esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
    #version: recommended
    #type: arduino


# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key


ota:
 - platform: esphome
   password: !secret ota_password
   on_begin:
    then:
      - switch.turn_off: ble_client_switch0
      - logger.log: "BLE connection suspended for OTA update"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "My-Inverter Fallback Hotspot"
    password: !secret ap_password

  on_connect:
    - delay: 5s
    - lambda: |-
        if (!id(auto_sync_clock_on_wifi).state) {
          ESP_LOGI("clock_sync", "Auto-sync disabled by switch. Skipping.");
          return;
        }
        auto sys_time = id(ha_time).now();
        if (!sys_time.is_valid()) {
          ESP_LOGW("clock_sync", "System time is not valid, skipping auto sync.");
          return;
        }

        std::string inv_str = id(inverter_current_data_time).state;
        if (inv_str.length() < 19) {
          ESP_LOGW("clock_sync", "Inverter time not available yet, performing sync.");
          id(inverter0).set_inverter_system_clock(sys_time.year, sys_time.month, sys_time.day_of_month,
                                                  sys_time.hour, sys_time.minute, sys_time.second);
          return;
        }

        int i_yr, i_mo, i_dy, i_hr, i_mn, i_sc;
        if (sscanf(inv_str.c_str(), "%d-%d-%d %d:%d:%d", &i_yr, &i_mo, &i_dy, &i_hr, &i_mn, &i_sc) == 6) {
          struct tm inv_tm = {0};
          inv_tm.tm_year = i_yr - 1900;
          inv_tm.tm_mon  = i_mo - 1;
          inv_tm.tm_mday = i_dy;
          inv_tm.tm_hour = i_hr;
          inv_tm.tm_min  = i_mn;
          inv_tm.tm_sec  = i_sc;

          time_t inv_epoch = mktime(&inv_tm);
          time_t sys_epoch = sys_time.timestamp;

          double diff_seconds = std::abs(difftime(sys_epoch, inv_epoch));
          ESP_LOGI("clock_sync", "Inverter time: %s, System epoch diff: %.1f sec", inv_str.c_str(), diff_seconds);

          if (diff_seconds > 30.0) {
            ESP_LOGI("clock_sync", "Time difference > 30s detected (%.1fs). Syncing inverter clock...", diff_seconds);
            id(inverter0).set_inverter_system_clock(sys_time.year, sys_time.month, sys_time.day_of_month,
                                                    sys_time.hour, sys_time.minute, sys_time.second);
          } else {
            ESP_LOGI("clock_sync", "Inverter clock is in sync (diff <= 30s).");
          }
        }

time:
  - platform: homeassistant
    id: ha_time

button:
  - platform: template
    name: "${inverter_name} Sync Inverter Clock Now"
    id: sync_clock_button
    icon: "mdi:clock-check-outline"
    on_press:
      - lambda: |-
          auto t = id(ha_time).now();
          if (t.is_valid()) {
            id(inverter0).set_inverter_system_clock(t.year, t.month, t.day_of_month, t.hour, t.minute, t.second);
            ESP_LOGI("clock_sync", "Manual sync sent: %04d-%02d-%02d %02d:%02d:%02d",
                     t.year, t.month, t.day_of_month, t.hour, t.minute, t.second);
          } else {
            ESP_LOGW("clock_sync", "Cannot sync: System time is not valid yet!");
          }

  - platform: template
    name: "${inverter_name} Send Custom PIP Command"
    on_press:
      then:
        - lambda: |-
            id(inverter0)->switch_command(id(custom_command_input).state);

